<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17212b">
    <title>Telegram Translate</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <div class="mobile-device-wrapper">
      <!-- Phone Mockup Status Bar -->
      <div class="mobile-status-bar">
        <span id="statusBarClock">9:41</span>
        <div class="status-bar-icons">
          <span>5G</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 24 14" fill="currentColor">
            <rect x="1" y="1" width="18" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="3" y="3" width="13" height="8" rx="1.5"/>
            <path d="M21 5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <!-- App Header -->
      <header class="app-header">
        <div class="app-user-badge">
          <div id="currentUserAvatar" class="user-avatar-sm">U</div>
          <div class="user-info-text">
            <h3 id="currentUserName">المستخدم</h3>
            <div class="user-handle-row">
              <span class="user-handle-prefix">حسابك:</span>
              <span id="currentUserHandle" dir="ltr" class="user-handle-tag">@user</span>
            </div>
          </div>
        </div>
        <div class="header-buttons">
          <button id="btnToggleLang" class="icon-btn" title="تبديل لغة الترجمة">
            <span id="currentUserLangBadge" class="lang-pill">AR</span>
          </button>
          <button id="btnLogout" class="icon-btn" title="تسجيل الخروج">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Search / Add Friend Bar -->
      <section class="search-add-box">
        <div class="search-input-wrap">
          <input 
            type="search" 
            id="addFriendInput" 
            name="friend_search_query_no_autofill" 
            placeholder="أضف صديق بالـ @username..." 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="off" 
            spellcheck="false" 
            data-lpignore="true" 
            data-1p-ignore="true"
          >
          <button id="btnAddFriend" class="btn-add-friend">إضافة</button>
        </div>
      </section>

      <!-- Incoming Friend Requests -->
      <section id="friendRequestsSection" class="friend-requests-section hidden">
        <div class="friend-requests-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
          <span>طلبات الصداقة الواردة</span>
        </div>
        <div id="friendRequestsList"></div>
      </section>

      <!-- Outgoing Friend Requests (Pending Approval) -->
      <section id="outgoingRequestsSection" class="friend-requests-section hidden" style="background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.25);">
        <div class="friend-requests-title" style="color: #f59e0b;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <span>طلبات الصداقة الصادرة (بانتظار الموافقة)</span>
        </div>
        <div id="outgoingRequestsList"></div>
      </section>

      <!-- Contacts List Scroll View -->
      <main class="contacts-scroll">
        <div id="contactsContainer"></div>
      </main>

      <!-- Telegram Chat & Profile View Overlay -->
      <div id="chatViewOverlay" class="chat-screen-overlay hidden">
        <header class="chat-header">
          <div class="chat-header-user">
            <button id="btnChatBack" class="btn-chat-back" title="رجوع">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
            <div id="chatContactAvatar" class="user-avatar-sm" style="width:34px;height:34px;font-size:0.9rem;">C</div>
            <div class="chat-header-meta">
              <h4 id="chatContactName">Contact</h4>
              <p id="chatContactStatus">Online</p>
            </div>
          </div>
          <div class="chat-header-actions">
            <span id="chatContactLangBadge" class="lang-pill">EN</span>
            <!-- Green Call Button -->
            <button id="btnChatCall" class="btn-header-call" title="بدء مكالمة صوتية مترجمة">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
            </button>
            <!-- Delete Contact inside Profile -->
            <button id="btnChatDelete" class="btn-header-del" title="حذف جهة الاتصال">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
              </svg>
            </button>
          </div>
        </header>

        <!-- Messages scroll container -->
        <div id="chatMessagesContainer" class="chat-messages-scroll"></div>

        <!-- Chat Input Bar -->
        <form id="chatInputForm" class="chat-input-bar">
          <input 
            type="text" 
            id="chatTextInput" 
            placeholder="اكتب رسالة مترجمة..." 
            autocomplete="off" 
            required
          >
          <button type="submit" class="btn-send-msg" title="إرسال">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
      </div>

      <!-- In-Call Fullscreen Overlay -->
      <div id="callOverlay" class="call-fullscreen-overlay hidden">
        <div class="call-header-info">
          <h2 id="callTargetName" class="call-target-name">Contact</h2>
          <p id="callStatusLine" class="call-state-text">جاري الاتصال...</p>
          <div id="callTimer" class="call-timer-badge">00:00</div>
        </div>

        <div class="call-center-animation">
          <div class="pulsating-circle-wrap">
            <div class="radar-ring"></div>
            <div id="callOverlayAvatar" class="call-avatar-big">C</div>
          </div>
          <div class="subtitles-card">
            <p id="callCaptionText" class="subtitles-text">الترجمة الفورية المباشرة مفعلة...</p>
          </div>
        </div>

        <div class="call-actions-row">
          <button id="btnCallMute" class="btn-call-circle btn-mute-toggle" title="كتم الصوت">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button id="btnCallEnd" class="btn-call-circle btn-hangup-call" title="إنهاء المكالمة">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
              <line x1="23" y1="1" x2="1" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Incoming Call Sheet -->
      <div id="incomingModal" class="incoming-call-overlay hidden">
        <div style="text-align: center;">
          <div id="incomingAvatar" class="call-avatar-big" style="margin: 0 auto;">C</div>
          <h2 id="incomingCallerName" class="incoming-title">Contact</h2>
          <p id="incomingCallerSub" class="incoming-sub">مكالمة مترجمة واردة...</p>
        </div>

        <div class="incoming-buttons">
          <button id="btnAcceptCall" class="btn-inc-accept" title="قبول المكالمة">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </button>
          <button id="btnDeclineCall" class="btn-inc-decline" title="رفض المكالمة">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Auth Inside Mobile Screen -->
      <div id="authBox" class="auth-inner-box">
        <div class="auth-header-logo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
          </svg>
          <h2>Telegram Translate</h2>
          <p style="color: var(--tg-text-secondary); font-size: 0.85rem;">مكالمات ومحادثات مترجمة فورية</p>
        </div>

        <div class="auth-tabs-row">
          <button id="tabLogin" class="auth-tab-btn active">تسجيل الدخول</button>
          <button id="tabRegister" class="auth-tab-btn">حساب جديد</button>
        </div>

        <form id="loginForm" class="auth-form-body">
          <div class="input-group">
            <label for="loginUsername">اسم المستخدم (Username)</label>
            <input type="text" id="loginUsername" name="username" class="input-field" required autocomplete="username">
          </div>
          <div class="input-group">
            <label for="loginPassword">كلمة المرور (Password)</label>
            <input type="password" id="loginPassword" name="password" class="input-field" required autocomplete="current-password">
          </div>
          <div id="loginError" class="form-error-msg hidden"></div>
          <button type="submit" class="btn-auth-submit">دخول</button>
        </form>

        <form id="registerForm" class="auth-form-body hidden">
          <div class="input-group">
            <label for="regUsername">اسم المستخدم الجديد (Username)</label>
            <input type="text" id="regUsername" name="username" class="input-field" required minlength="3">
          </div>
          <div class="input-group">
            <label for="regDisplayName">الاسم الظاهر (Display Name)</label>
            <input type="text" id="regDisplayName" name="display_name" class="input-field">
          </div>
          <div class="input-group">
            <label for="regPassword">كلمة المرور (Password)</label>
            <input type="password" id="regPassword" name="password" class="input-field" required minlength="6">
          </div>
          <div class="input-group">
            <label for="regLanguage">لغتك الأساسية</label>
            <select id="regLanguage" class="input-field">
              <option value="ar">العربية (Arabic)</option>
              <option value="en">English (الإنجليزية)</option>
            </select>
          </div>
          <div id="regError" class="form-error-msg hidden"></div>
          <button type="submit" class="btn-auth-submit">إنشاء الحساب</button>
        </form>
      </div>
    </div>

    <!-- Hidden audio elements -->
    <audio id="appTranslatedAudio" autoplay playsinline></audio>
    <audio id="appAudioPuller" muted playsinline hidden></audio>

    <script src="/static/app.js" defer></script>
  </body>
</html>
